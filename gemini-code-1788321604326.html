<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hey Ballif Family Where Are We eating?</title>
    <style>
        /* CSS Variables for Light and Dark Mode */
        :root {
            --bg-color: #f4f4f9;
            --text-color: #333333;
            --card-bg: #ffffff;
            --primary: #4a90e2;
            --primary-hover: #357abd;
            --border: #cccccc;
        }

        [data-theme="dark"] {
            --bg-color: #1a1a2e;
            --text-color: #e0e0e0;
            --card-bg: #16213e;
            --primary: #e94560;
            --primary-hover: #d23b55;
            --border: #444444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0;
        }

        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            transition: background-color 0.3s;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 5px;
            background-color: var(--bg-color);
            color: var(--text-color);
            box-sizing: border-box;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.2s;
            margin-right: 10px;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .admin-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        #rankingsList {
            list-style-type: none;
            padding: 0;
        }

        #rankingsList li {
            padding: 10px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
        }
        
        #rankingsList li:last-child {
            border-bottom: none;
        }
        
        .vote-count {
            font-weight: bold;
            color: var(--primary);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Hey Ballif Family,<br>Where Are We Eating? 🍔</h1>
        <button id="themeToggle" onclick="toggleTheme()">🌙 Dark</button>
    </header>

    <div class="card">
        <h2>Submit Your Votes</h2>
        <div class="form-group">
            <label for="memberName">Your Name</label>
            <input type="text" id="memberName" placeholder="e.g. Mom, Dad, Timmy">
        </div>
        <div class="form-group">
            <label>Choice 1</label>
            <input type="text" id="choice1" placeholder="First choice...">
        </div>
        <div class="form-group">
            <label>Choice 2</label>
            <input type="text" id="choice2" placeholder="Second choice...">
        </div>
        <div class="form-group">
            <label>Choice 3</label>
            <input type="text" id="choice3" placeholder="Third choice...">
        </div>
        <button onclick="submitVotes()">Submit Votes</button>
    </div>

    <div class="card">
        <h2>Current Rankings 🏆</h2>
        <ul id="rankingsList">
            </ul>
    </div>

    <div class="card admin-controls">
        <button onclick="resetVotes()" style="background-color: #ff4757;">Reset Voting</button>
        <button onclick="shareLink()" style="background-color: #2ed573;">Copy Share Link</button>
    </div>
</div>

<script>
    // --- Theme Logic ---
    function toggleTheme() {
        const body = document.body;
        const currentTheme = body.getAttribute('data-theme');
        const btn = document.getElementById('themeToggle');
        
        if (currentTheme === 'dark') {
            body.removeAttribute('data-theme');
            btn.innerText = '🌙 Dark';
            localStorage.setItem('ballifTheme', 'light');
        } else {
            body.setAttribute('data-theme', 'dark');
            btn.innerText = '☀️ Light';
            localStorage.setItem('ballifTheme', 'dark');
        }
    }

    // Load saved theme on load
    if (localStorage.getItem('ballifTheme') === 'dark') {
        document.body.setAttribute('data-theme', 'dark');
        document.getElementById('themeToggle').innerText = '☀️ Light';
    }

    // --- Voting Logic ---
    let votes = JSON.parse(localStorage.getItem('ballifVotes')) || [];

    function submitVotes() {
        const name = document.getElementById('memberName').value.trim();
        const c1 = document.getElementById('choice1').value.trim();
        const c2 = document.getElementById('choice2').value.trim();
        const c3 = document.getElementById('choice3').value.trim();

        if (!name || !c1 || !c2 || !c3) {
            alert("Please fill out your name and all 3 choices!");
            return;
        }

        // Add to votes array
        votes.push({
            name: name,
            choices: [c1, c2, c3]
        });

        // Save to local storage
        localStorage.setItem('ballifVotes', JSON.stringify(votes));
        
        // Clear form
        document.getElementById('memberName').value = '';
        document.getElementById('choice1').value = '';
        document.getElementById('choice2').value = '';
        document.getElementById('choice3').value = '';

        alert(`Thanks ${name}! Your votes are in.`);
        updateRankings();
    }

    function updateRankings() {
        const rankingsList = document.getElementById('rankingsList');
        rankingsList.innerHTML = '';

        if (votes.length === 0) {
            rankingsList.innerHTML = '<li>No votes yet. Be the first!</li>';
            return;
        }

        // Count frequencies
        const counts = {};
        votes.forEach(voteRecord => {
            voteRecord.choices.forEach(restaurant => {
                // Normalize string (lowercase and trim) to group "Taco Bell" and "taco bell" together
                const normalized = restaurant.toLowerCase();
                if (!counts[normalized]) {
                    counts[normalized] = { name: restaurant, count: 0 }; // keep original casing for display
                }
                counts[normalized].count += 1;
            });
        });

        // Sort from highest to lowest
        const sortedRestaurants = Object.values(counts).sort((a, b) => b.count - a.count);

        // Display
        sortedRestaurants.forEach(item => {
            const li = document.createElement('li');
            li.innerHTML = `<span>${item.name}</span> <span class="vote-count">${item.count} vote(s)</span>`;
            rankingsList.appendChild(li);
        });
    }

    function resetVotes() {
        if (confirm("Are you sure you want to clear all current votes?")) {
            votes = [];
            localStorage.removeItem('ballifVotes');
            updateRankings();
        }
    }

    function shareLink() {
        // Copies the current URL to the clipboard
        const url = window.location.href;
        navigator.clipboard.writeText(url).then(() => {
            alert("Link copied to clipboard! Share it with the family.");
        }).catch(err => {
            alert("Failed to copy link. You can manually copy the URL in your browser address bar.");
        });
    }

    // Initialize rankings on page load
    updateRankings();
</script>
</body>
</html>
